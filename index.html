<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>kyzam</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>kyzam</h1>
    <input type="number" id="char" min="1" value="4" max="12" placeholder="Enter number of characters (1-12)">
    <div id="kolecka">
        <img class="open" src="open-optimized.jpg" id="img">
    </div>
    <p id="wheel-help">Na mobilu přejeď po kolečku nahoru nebo dolů. Číslici můžeš zadat také přes numerickou klávesnici.</p>
    <p id="link-help">
        Odkaz ve zprávě zapiš jako <code>a:/www.google.com/:a</code>.
        Značky se po odemčení změní v klikací odkaz.
    </p>
    <button class="random">random</button>
    <div id="message-setting">
        <label for="message">Zpráva po odemčení</label>
        <input type="text" id="message" maxlength="1000" placeholder="Zadej zprávu">
    </div>
    <button class="generate">Vytvořit odkaz</button>
    <p id="share-result" aria-live="polite"></p>
    <div id="qr-code" aria-label="QR kód odkazu"></div>
</body>
</html>
